<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | BuyBloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Skranji:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
          
            BuyBloom
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="orders.html">📦 My Orders</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">
                        🛒 Cart (<span id="cartCount">0</span>)
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="wishlist.html">
                        ❤️ Wishlist (<span id="wishlistCount">0</span>)
                    </a>
                </li>

                <!-- Login/User -->
                <li class="nav-item dropdown" id="loginMenu">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>
              <li class="nav-item">
                    <a class="nav-link " href="contact.html">Contact Us</a>
                </li>
            </ul>

        </div>

    </div>
</nav>


    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4 text-danger">
                        Create Account
                    </h2>

                    <form id="signupForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input   type="text"   class="form-control" id="name"   > 
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input  type="email"   class="form-control" id="email"   > 
                               
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel"   class="form-control" id="phone"   > 
                              
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input  type="password"   class="form-control" id="password"   > 
                              
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password"   class="form-control" id="confirmPassword"   > 
                               
                        </div>

                        <button class="btn btn-danger w-100">
                            Create Account
                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </div>

            </div>

        </div>

    </div>
   <script src="./scripts/app.js"></script>
    <script src="./scripts/auth.js"></script>

</body>

</html>
