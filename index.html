<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyBloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Skranji:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-danger navbar-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            
            BuyBloom
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="orders.html">📦 My Orders</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">
                        🛒 Cart (<span id="cartCount">0</span>)
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="wishlist.html">
                        ❤️ Wishlist (<span id="wishlistCount">0</span>)
                    </a>
                </li>

                <!-- Login/User -->
                <li class="nav-item dropdown" id="loginMenu">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>
                    <li class="nav-item">
                    <a class="nav-link " href="contact.html">Contact Us</a>
                </li>
            </ul>

        </div>

    </div>
</nav>

   <section class="container-fluid p-0">

   <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="./images/banner1.png" class="d-block w-100 banner-img" alt="Banner">
        </div>

        <div class="carousel-item">
            <img src="./images/banner3.png" class="d-block w-100 banner-img" alt="Banner">
        </div>

        <div class="carousel-item">
            <img src="./images/banner2.png" class="d-block w-100 banner-img" alt="Banner">
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

</section>
<section class="container py-4">

    <div class="row g-3">

        <!-- Search -->
        <div class="col-lg-4">
            <input   type="text"  id="searchInput" class="form-control"placeholder="Search products..."  >
                
               </div>
                
                
          
       

        <!-- Category -->
        <div class="col-lg-3">
            <select id="categoryFilter" class="form-select">
                <option value="all">All Categories</option>
            </select>
        </div>
<!-- Sort -->
<div class="col-lg-3">
    <select id="sortProducts" class="form-select">
        <option value="">Sort By</option>
        <option value="priceAsc">Price: Low to High</option>
        <option value="priceDesc">Price: High to Low</option>
        <option value="ratingAsc">Rating: Low to High</option>
        <option value="ratingDesc">Rating: High to Low</option>
        <option value="newest">Newest</option>
    </select>
</div>
<!-- Rating -->
<div class="col-lg-3">
    <select id="ratingFilter" class="form-select">
        <option value="">All Ratings</option>
        <option value="4">4★ & Above</option>
        <option value="3">3★ & Above</option>
        <option value="2">2★ & Above</option>
        <option value="1">1★ & Above</option>
    </select>
</div>
        <!-- Min Price -->
        <div class="col-lg-2">
            <input
                type="number"   id="minPrice"  class="form-control" placeholder="Min Price">
            
              
              
                
        </div>

        <!-- Max Price -->
        <div class="col-lg-2">
            <input
                type="number"  id="maxPrice"  class="form-control"  placeholder="Max Price">
               
              
              
            
        </div>

        <!-- Clear -->
        <div class="col-lg-1">
            <button id="clearFilter" class="btn btn-buy w-100">
                Clear
            </button>
        </div>

    </div>

</section>
    <!-- Products -->
   <section class="container py-5">

    <h2 class="text-center fw-bold mb-5">
        Latest Products
    </h2>

    <div class="row g-4" id="productsList">

    </div>

</section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

<script src="./scripts/app.js"></script>
<script src="./scripts/product.js"></script>


</body>
</html>
